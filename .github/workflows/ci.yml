name: CI

on:
  push:
    branches: [main, 'release/**', 'sprint/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install (root)
        run: npm ci --ignore-scripts
      - name: Audit (root) — block high+
        run: npm audit --audit-level=high --omit=dev || (echo 'High vulns found' && exit 1)
      - name: Install (client)
        run: cd client && npm ci --ignore-scripts
      - name: Audit (client)
        run: cd client && npm audit --audit-level=high
      - name: Install (desktop)
        run: cd desktop && npm ci --ignore-scripts
      - name: Audit (desktop)
        run: cd desktop && npm audit --audit-level=high

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm test
      - run: cd desktop && npm ci && npm run test:license

  test-client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: cd client && npm ci
      - run: cd client && npm test

  build:
    name: Build artefacts
    runs-on: ubuntu-latest
    needs: [lint, test-server, test-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: cd client && npm ci && npm run build
      - run: npm run perf-budget
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7

  build-installers:
    name: Build installers (mac arm64 only on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: cd client && npm ci && npm run build
      - run: cd desktop && npm ci
      - run: cd desktop && npx electron-builder --mac --arm64 --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          path: desktop/dist-electron/*.dmg
